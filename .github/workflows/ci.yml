name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许在分发源迁移或需要补发产物时手动触发
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -p 1 ./... -count=1
      - name: Vet
        run: go vet -p 1 ./...
      - name: Build
        run: go build -o subpanel ./cmd/subpanel
      - name: Installer syntax
        run: |
          bash -n install.sh
          # runner 未必带 shellcheck，没有就只做语法检查
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning install.sh
          fi

  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o "subpanel-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/subpanel
      - uses: actions/upload-artifact@v4
        with:
          name: subpanel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: subpanel-*

  # 交叉编译 linux 各架构，连同安装脚本一起发布到 dist 分支。
  # 安装脚本从这里下载二进制并做 SHA256 校验，因此 dist 必须整体可替换。
  publish-dist:
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build linux binaries
        run: |
          set -euo pipefail
          VER=$(grep -oP 'Version = "\K[^"]+' internal/config/config.go)
          SHA7=${GITHUB_SHA:0:7}
          echo "version ${VER}+${SHA7}"
          mkdir -p out
          build() {
            name=$1; goarch=$2; goarm=${3:-}
            CGO_ENABLED=0 GOOS=linux GOARCH="$goarch" GOARM="$goarm" \
              go build -trimpath -buildvcs=false \
                -ldflags "-s -w -X subpanel/internal/config.Version=${VER}+${SHA7}" \
                -o "out/subpanel-linux-${name}" ./cmd/subpanel
            echo "  built linux/${name}"
          }
          build amd64   amd64
          build arm64   arm64
          build armv7   arm     7
          build armv6   arm     6
          build 386     386
          build s390x   s390x
          build riscv64 riscv64
          cp install.sh out/
          ( cd out && sha256sum subpanel-linux-* install.sh > SHA256SUMS )
          cat out/SHA256SUMS
      - name: Publish dist branch
        run: |
          set -euo pipefail
          mkdir -p /tmp/dist
          cp out/* /tmp/dist/
          # out/ 是构建目录，不能跟着进 dist 分支
          rm -rf out
          git checkout --orphan dist-new
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/dist/* .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 产物文件名命中 .gitignore 的 /subpanel-*，必须强制加入
          git add -f -A .
          git status --short
          git commit -m "dist: rebuild from ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" dist-new:dist
